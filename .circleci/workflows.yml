# DO NOT EDIT. This file is generated by `devctl gen circleci` and kept in sync
# by the giantswarm/github align-files workflow. Change the generator in devctl
# (pkg/gen/input/circleci) or the gen.ci config in giantswarm/github, not here.
# Repo-specific jobs and workflows go in .circleci/custom.yml, which the setup
# workflow in .circleci/config.yml merges into this file at pipeline runtime.
version: 2.1
orbs:
  architect: giantswarm/architect@10.5.0

jobs:
  # Chart build of a template repository (componentType: template in the
  # giantswarm/github team file). The chart lives at helm/{APP-NAME} and
  # carries the placeholders a repository created from this template fills in
  # ({APP-NAME}, {TEAM-NAME}, {APP HELM REPOSITORY}), so app-build-suite
  # cannot read it as it is. This job renders the checkout with fixture values
  # first -- the app name and the Helm repository are fixtures, the team is the
  # owning team from the team file -- and builds the rendered chart: green means
  # a repository created from this template passes its first app-build-suite
  # run (team label, icon, schema). The rendering is the literal token
  # substitution the set-up engine performs (`devctl replace`); it runs as sed
  # here because the app-build-suite image carries no devctl. Nothing is
  # released from a template, so there are no chart-test or push jobs.
  build-chart:
    executor: architect/app-build-suite
    resource_class: small
    steps:
    - checkout
    - run:
        name: Render the template with fixture values
        # Only files that carry a token are rewritten (a template ships icons
        # and other binaries too), and .circleci/ is left alone: this pipeline
        # spells the tokens out, and a created repository's pipeline is
        # regenerated by align-files anyway. No pipefail: `git grep` exits 1
        # when nothing matches, and a token-less template fails on the mv
        # below with the clearer message.
        command: |
          set -eu
          git grep -l -z -F -e '{APP-NAME}' -e '{TEAM-NAME}' -e '{APP HELM REPOSITORY}' -- . ':!.circleci' \
            | xargs -0 -r sed -i \
                -e 's/{APP-NAME}/sample-app/g' \
                -e 's/{TEAM-NAME}/honeybadger/g' \
                -e 's#{APP HELM REPOSITORY}#https://charts.example.com#g'
          mv 'helm/{APP-NAME}' 'helm/sample-app'
    - architect/determine-catalog-name:
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
    - architect/package-helm-with-abs:
        chart: sample-app
        # `appVersion` is the version of the packaged application, and this chart
        # packages an app built elsewhere, so that app's version is what
        # Chart.yaml declares. Keep it; the chart version is still stamped.
        override_app_version: false

workflows:
  build:
    jobs:

    # build-chart: render the template with fixture values, then package + lint
    # the rendered chart via app-build-suite (the job is defined above). Runs on
    # every branch, main included: a template is never tagged, so the branch
    # run is the only signal there is.
    - build-chart
